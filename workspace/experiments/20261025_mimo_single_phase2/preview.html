<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qwen3-TTS</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#202329;background:#f4f5f7;font:15px system-ui,sans-serif;letter-spacing:0}
header{border-bottom:1px solid #d9dde3;background:#fff;padding:20px 24px}
header div,main{max-width:880px;margin:auto}header div{display:flex;align-items:center;justify-content:space-between;gap:16px}
h1{font-size:22px;margin:0}main{padding:28px 24px}label{display:block;font-weight:600;margin:0 0 9px}
textarea,select{font:inherit;color:inherit;background:white;border:1px solid #b8bec8;border-radius:4px;padding:12px;width:100%}
textarea{resize:vertical;min-height:180px;line-height:1.65}textarea:focus,select:focus{outline:2px solid #15806c;outline-offset:2px}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:24px 0}
.tools{display:flex;gap:12px;align-items:center;min-height:44px;flex-wrap:wrap}
button{width:44px;height:44px;border:1px solid #15806c;border-radius:4px;background:#15806c;color:white;font:22px system-ui;cursor:pointer}
button.stop{background:#fff;color:#bd3f48;border-color:#bd3f48}button:disabled{opacity:.4;cursor:default}
#state{font-size:14px;color:#505966;overflow-wrap:anywhere}#health{font-size:13px;color:#505966;white-space:nowrap}
canvas{display:block;width:100%;height:150px;background:#fff;border-bottom:1px solid #d9dde3;margin:28px 0 0}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding-top:16px;font-size:13px;color:#59636e}
.metrics strong{display:block;color:#202329;font-size:17px;margin-top:6px}audio{width:100%;margin-top:24px}
@media(max-width:520px){header{padding:16px}main{padding:24px 16px}.settings{gap:12px}.metrics strong{font-size:15px}}
</style>
<header><div><h1>Qwen3-TTS</h1><span id="health">Connecting</span></div></header>
<main>
<label for="text">&#25991;&#26412;</label>
<textarea id="text" maxlength="1600">&#20320;&#22909;&#65292;&#25105;&#26159;&#35821;&#38899;&#21161;&#25163;&#12290;&#25105;&#20204;&#21487;&#20197;&#19968;&#36793;&#20132;&#27969;&#65292;&#19968;&#36793;&#22788;&#29702;&#26032;&#30340;&#38382;&#39064;&#12290;</textarea>
<div class="settings">
<div><label for="voice">&#38899;&#33394;</label><select id="voice">
<option value="vivian">Vivian</option><option value="serena">Serena</option><option value="ryan">Ryan</option><option value="aiden">Aiden</option>
</select></div>
<div><label for="language">&#35821;&#35328;</label><select id="language">
<option>Auto</option><option>Chinese</option><option>English</option><option>Japanese</option><option>Korean</option><option>French</option><option>German</option><option>Spanish</option>
</select></div>
</div>
<div class="tools">
<button id="play" title="&#21512;&#25104;&#24182;&#25773;&#25918;" aria-label="&#21512;&#25104;&#24182;&#25773;&#25918;">&#9654;</button>
<button id="stop" class="stop" disabled title="&#20572;&#27490;" aria-label="&#20572;&#27490;">&#9632;</button>
<span id="state">Ready</span>
</div>
<canvas id="wave" aria-label="&#38899;&#39057;&#27874;&#24418;"></canvas>
<div class="metrics">
<div>&#39318;&#23383;&#33410;<strong id="first">-</strong></div>
<div>&#26377;&#25928;&#38899;&#39057;&#21040;&#36798;<strong id="energy">-</strong></div>
<div>&#38899;&#39057;&#26102;&#38271;<strong id="duration">-</strong></div>
</div>
<audio id="replay" controls hidden></audio>
</main>
<script>
const $=id=>document.getElementById(id);
const SR=24000;let ctx=null,controller=null,sources=[],revision=0,url=null,raf=null;
function stop(){
  revision++;controller?.abort();controller=null;
  for(const source of sources){try{source.stop()}catch{}}
  sources=[];$("replay").pause();cancelAnimationFrame(raf);
  $("play").disabled=false;$("stop").disabled=true;$("state").textContent="Stopped";
}
$("stop").onclick=stop;
function draw(samples){
  const canvas=$("wave"),w=canvas.clientWidth,h=canvas.clientHeight,dpr=devicePixelRatio||1;
  canvas.width=w*dpr;canvas.height=h*dpr;
  const c=canvas.getContext("2d");c.scale(dpr,dpr);c.clearRect(0,0,w,h);
  c.strokeStyle="#15806c";c.lineWidth=1;c.beginPath();
  const stride=Math.max(1,Math.ceil(samples.length/w));
  for(let x=0;x<w;x++){
    let peak=0;for(let i=x*stride;i<Math.min((x+1)*stride,samples.length);i++)peak=Math.max(peak,Math.abs(samples[i]));
    c.moveTo(x,h/2-peak*h*.45);c.lineTo(x,h/2+peak*h*.45);
  }c.stroke();
}
function wav(parts,size){
  const out=new Uint8Array(44+size),v=new DataView(out.buffer);
  const text=(offset,s)=>{for(let i=0;i<s.length;i++)out[offset+i]=s.charCodeAt(i)};
  text(0,"RIFF");v.setUint32(4,36+size,true);text(8,"WAVE");text(12,"fmt ");
  v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,SR,true);v.setUint32(28,SR*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);
  text(36,"data");v.setUint32(40,size,true);let offset=44;
  for(const p of parts){out.set(p,offset);offset+=p.length}
  return new Blob([out],{type:"audio/wav"});
}
$("play").onclick=async()=>{
  stop();const current=revision;controller=new AbortController();const signal=controller.signal;
  $("play").disabled=true;$("stop").disabled=false;$("replay").hidden=true;
  $("first").textContent=$("energy").textContent=$("duration").textContent="-";
  $("state").textContent="Connecting";
  let next=0,samplesCount=0,first=false,energy=false,pending=new Uint8Array(0),parts=[],bytes=0;
  try{
    ctx??=new AudioContext();await ctx.resume();
    const started=performance.now();
    const response=await fetch("/api/speech",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({input:$("text").value,voice:$("voice").value,language:$("language").value}),signal});
    if(!response.ok)throw Error(await response.text());
    const reader=response.body.getReader();
    for(;;){
      const {done,value}=await reader.read();if(done)break;if(current!==revision)return;
      if(!first){$("first").textContent=(performance.now()-started).toFixed(0)+" ms";first=true}
      const raw=new Uint8Array(pending.length+value.length);raw.set(pending);raw.set(value,pending.length);
      const usable=raw.length-raw.length%2;pending=raw.slice(usable);if(!usable)continue;
      const pcm=raw.slice(0,usable);parts.push(pcm);bytes+=usable;
      const view=new DataView(pcm.buffer),floats=new Float32Array(usable/2);
      for(let i=0;i<floats.length;i++)floats[i]=view.getInt16(i*2,true)/32768;
      if(!energy){
        for(let i=0;i+480<=floats.length;i+=480){
          let sum=0;for(let j=i;j<i+480;j++)sum+=floats[j]*floats[j];
          if(Math.sqrt(sum/480)>=.002){energy=true;$("energy").textContent=(performance.now()-started).toFixed(0)+" ms";break}
        }
      }
      draw(floats);const buffer=ctx.createBuffer(1,floats.length,SR);buffer.copyToChannel(floats,0);
      const source=ctx.createBufferSource();source.buffer=buffer;source.connect(ctx.destination);sources.push(source);
      source.onended=()=>{sources=sources.filter(s=>s!==source)};
      next=Math.max(next,ctx.currentTime+.03);source.start(next);next+=buffer.duration;
      samplesCount+=floats.length;$("duration").textContent=(samplesCount/SR).toFixed(2)+" s";
      $("state").textContent="Playing";
    }
    if(pending.length)throw Error("Incomplete PCM sample");
    if(!bytes)throw Error("No audio received");
    if(current!==revision)return;
    if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(wav(parts,bytes));
    $("replay").src=url;$("replay").hidden=false;
    $("state").textContent="Finishing playback";
    const wait=()=>{if(current!==revision)return;if(ctx.currentTime>=next){$("state").textContent="Done";$("play").disabled=false;$("stop").disabled=true}else raf=requestAnimationFrame(wait)};
    wait();
  }catch(error){
    if(current!==revision)return;for(const source of sources){try{source.stop()}catch{}}sources=[];
    $("state").textContent=error.name==="AbortError"?"Stopped":error.message;
    $("play").disabled=false;$("stop").disabled=true;
  }
};
async function health(){
  try{const r=await fetch("/api/status"),s=await r.json();$("health").textContent=s.tts?"TTS ready":"TTS loading"}
  catch{$("health").textContent="Disconnected"}
}
health();setInterval(health,5000);draw(new Float32Array(0));
window.addEventListener("pagehide",stop);
</script>
</html>
